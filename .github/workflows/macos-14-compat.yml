name: macOS Compatibility

on:
  pull_request:
    paths:
      - 'native/macos/**'
      - '.github/workflows/macos-14-compat.yml'
  workflow_dispatch:

jobs:
  macos-smoke:
    name: macOS smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native agent
        run: ./native/macos/scripts/build-app.sh

      - name: Verify arm64 architecture
        run: |
          BINARY="native/macos/.build/Appshot Agent.app/Contents/MacOS/appshot-macos"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "archs=$ARCHS"
          if [[ "$ARCHS" != "arm64" ]]; then
            echo "Expected arm64-only macOS binary, got: $ARCHS" >&2
            exit 1
          fi

      - name: Verify deployment target
        run: |
          BINARY="native/macos/.build/Appshot Agent.app/Contents/MacOS/appshot-macos"
          otool -l "$BINARY" | awk '
            $1 == "cmd" && $2 == "LC_BUILD_VERSION" { in_build_version = 1; next }
            in_build_version && $1 == "minos" { print "minos=" $2; if ($2 != "14.0") exit 1; found = 1; exit }
            END { if (!found) exit 1 }
          '

      - name: Verify macOS 26-only Swift runtime is not linked
        run: |
          BINARY="native/macos/.build/Appshot Agent.app/Contents/MacOS/appshot-macos"
          if otool -L "$BINARY" | grep -q 'libswift_DarwinFoundation2.dylib'; then
            echo "Unexpected macOS 26-only Swift runtime dependency found" >&2
            exit 1
          fi

      - name: Smoke test native agent startup
        run: |
          "native/macos/.build/Appshot Agent.app/Contents/MacOS/appshot-macos" --help
